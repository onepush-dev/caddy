name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile', 'Caddyfile', 'railway/**', 'www/**', '.github/workflows/publish-ghcr.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/onepush-dev/caddy:2.11.7
            ghcr.io/onepush-dev/caddy:latest
          platforms: linux/amd64
